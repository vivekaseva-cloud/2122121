      function extractYouTubeId(input) {
        if (!input || typeof input !== 'string') return null;
        const cleanInput = input.trim();
        const iframeMatch = cleanInput.match(/src=["'](?:https?:)?\/\/www\.youtube(?:-nocookie)?\.com\/embed\/([a-zA-Z0-9_-]{11})/i);
        if (iframeMatch && iframeMatch[1]) return iframeMatch[1];
        const regExp = /(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|v\/|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/i;
        const match = cleanInput.match(regExp);
        if (match && match[1]) return match[1];
        if (/^[a-zA-Z0-9_-]{11}$/.test(cleanInput)) return cleanInput;
        return null;
      }

      function escapeHtml(str) {
        if (!str) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function compressPhotoFile(file, maxDim = 800, quality = 0.78) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = function(ev) {
            const img = new Image();
            img.onload = function() {
              let w = img.width;
              let h = img.height;
              if (w > maxDim || h > maxDim) {
                if (w > h) {
                  h = Math.round((h * maxDim) / w);
                  w = maxDim;
                } else {
                  w = Math.round((w * maxDim) / h);
                  h = maxDim;
                }
              }
              const canvas = document.createElement('canvas');
              canvas.width = w;
              canvas.height = h;
              const ctx = canvas.getContext('2d');
              if (!ctx) {
                resolve(String(ev.target.result || ''));
                return;
              }
              ctx.drawImage(img, 0, 0, w, h);
              resolve(canvas.toDataURL('image/jpeg', quality));
            };
            img.onerror = function() { reject(new Error('Image load error')); };
            img.src = String(ev.target.result || '');
          };
          reader.onerror = function() { reject(new Error('File read error')); };
          reader.readAsDataURL(file);
        });
      }

      function buildCleanStandaloneHtmlString() {
        const snapEl = document.getElementById('snv-embedded-snapshot');
        if (snapEl) {
          snapEl.textContent = JSON.stringify({
            videos: State.videos,
            services: State.services,
            ads: State.ads,
            yantras: State.yantras,
            googleAds: State.googleAds
          });
        }
        const appEl = document.getElementById('app');
        const currentMarkup = appEl ? appEl.innerHTML : '';
        if (appEl) appEl.innerHTML = '';
        const doctype = '<!doctype html>\n';
        const fullHtml = doctype + document.documentElement.outerHTML;
        if (appEl) appEl.innerHTML = currentMarkup;
        return fullHtml;
      }

      // --- DOWNLOAD OR COPY STANDALONE INDEX.HTML FOR CPANEL (ADMIN ONLY) ---
      window.downloadStandaloneHtml = function() {
        const fullHtml = buildCleanStandaloneHtmlString();
        const blob = new Blob([fullHtml], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'index.html';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      };

      window.copyStandaloneHtml = function() {
        const fullHtml = buildCleanStandaloneHtmlString();
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(fullHtml).then(() => {
            State.copiedHtmlSuccess = true;
            renderApp();
            setTimeout(() => {
              State.copiedHtmlSuccess = false;
              renderApp();
            }, 2500);
          });
        }
      };
